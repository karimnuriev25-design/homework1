<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dyson</title>
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/base/fonts.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
        <svg width="50" height="50" class="burger">
          <use href="./icons/basket.svg#burger"></use>
        </svg>
        <img
          width="183"
          height="77"
          class="header__img"
          src="./images/logo.svg"
          alt=""
        />

        <nav class="header__menu">
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__link" href="#">О нас</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#">Доставка и оплата</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#">Регистрация продукта</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#">Сервис</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#">Сертификаты и лицензии</a>
            </li>
          </ul>
        </nav>
        <svg class="basket" width="36" height="36">
          <use href="./icons/basket.svg#basket"></use>
        </svg>
      </div>
    </header>
    <section class="hero">
      <div class="container hero__container">
        <div class="hero__info">
          <h1 class="hero__title">
            Уникальные технологии для ухода за волосами
          </h1>
          <p class="hero__text">
            Идеальная укладка для всех типов волос вместе с Dyson
          </p>
          <a class="button" href="#">Подробнее</a>
        </div>
        <div class="hero__img">
          <img src="./images/women.png" width="997" height="850" alt="" />
        </div>
      </div>
    </section>
  </body>
</html>
