<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nike Air Mag</title>
    <link rel="stylesheet" href="./css/index.css" />

    <link
      rel="shortcut icon"
      href="./incons/nike-favicon-icon.ico"
      type="image/x-icon"
    />
    <script defer src="./js/index.js" type="module"></script>
  </head>

  <body class="page__body">
    <header class="header header--fixed">
      <div class="container header__container">
        <a class="logo header__logo" href="#">
          <img
            src="./incons/header-logo-icon.svg"
            width="50"
            height="20"
            alt="Логотип Nike"
          />
        </a>
        <nav
          id="header__menu"
          class="menu header__menu"
          aria-label="Главное меню"
          aria-expanded="false"
          aria-controls="header__menu"
        >
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__link" href="#air mag" lang="en">Air Mag</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#sizes">Размеры</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#characteristics">Характеристики</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#top-models">Другие ТОП модели</a>
            </li>
          </ul>
        </nav>

        <div class="header__controls">
          <a class="header__order" href="#">Сделать заказ</a>
          <div class="header__actions">
            <button
              class="header__actions-button"
              title="Поиск"
              aria-label="Поиск"
            >
              <svg width="24" height="24">
                <use
                  class="header__actions-icon"
                  href="./incons/sprite.svg#search"
                ></use>
              </svg>
            </button>
            <button
              class="header__actions-button"
              title="Корзина"
              aria-label="Корзина"
            >
              <svg width="24" height="24">
                <use
                  class="header__actions-icon"
                  href="./incons/sprite.svg#cart"
                ></use>
              </svg>
            </button>
            <button class="header__burger burger" aria-label="Открыть меню">
              <svg width="24" height="24">
                <use
                  class="burger__icon-menu"
                  href="./incons/sprite.svg#menu-burger"
                ></use>
                <use
                  class="burger__icon-cross"
                  href="./incons/sprite.svg#menu-cross"
                ></use>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
